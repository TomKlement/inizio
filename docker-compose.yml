services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file: .env.local
    volumes:
      - .:/app
      # node_modules and .next stay on the Linux volume, not on the Windows mount.
      - node_modules:/app/node_modules
      - next:/app/.next

volumes:
  node_modules:
  next:
